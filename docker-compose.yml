services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeflow}
      POSTGRES_DB: ${POSTGRES_DB:-forgeflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgeflow} -d ${POSTGRES_DB:-forgeflow}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgeflow}:${POSTGRES_PASSWORD:-forgeflow}@postgres:5432/${POSTGRES_DB:-forgeflow}
      FORGEFLOW_ENVIRONMENT: ${FORGEFLOW_ENVIRONMENT:-development}
      FORGEFLOW_LOG_LEVEL: ${FORGEFLOW_LOG_LEVEL:-INFO}
      FORGEFLOW_LOG_JSON: ${FORGEFLOW_LOG_JSON:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
