[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeflow-ai"
version = "0.1.0"
description = "Production-oriented industrial agentic AI platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "ForgeFlow AI Contributors" }]
keywords = ["agentic-ai", "industrial", "langgraph", "fastapi", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "starlette>=0.46.0,<1.0.0",
    "mcp>=1.2.0,<3.0.0",
    "langgraph>=0.2.0,<2.0.0",
    "openai>=1.40.0,<4.0.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0,<4.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/forgeflow-ai/forgeflow-ai"
Documentation = "https://github.com/forgeflow-ai/forgeflow-ai/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["forgeflow", "apps"]

[tool.hatch.build.targets.wheel.force-include]
"sample_data" = "sample_data"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["forgeflow", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]

[tool.ruff.lint.per-file-ignores]
"forgeflow/db/migrations/versions/*.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
packages = ["forgeflow", "apps"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a reachable PostgreSQL instance",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
