name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forgeflow
          POSTGRES_PASSWORD: forgeflow
          POSTGRES_DB: forgeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeflow -d forgeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://forgeflow:forgeflow@localhost:5432/forgeflow
      FORGEFLOW_ENVIRONMENT: test
      LLM_PROVIDER: mock
      FORGEFLOW_AS_OF: "2026-09-03T12:00:00+00:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check forgeflow apps tests evals
      - name: Ruff format
        run: ruff format --check forgeflow apps tests evals
      - name: Type check
        run: mypy forgeflow apps evals
      - name: Apply migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: Synthetic evaluation
        run: python -m evals --output-dir evals/reports

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/api/Dockerfile -t forgeflow-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/web/Dockerfile -t forgeflow-web:ci .
