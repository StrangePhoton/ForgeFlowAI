name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forgeflow
          POSTGRES_PASSWORD: forgeflow
          POSTGRES_DB: forgeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeflow -d forgeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://forgeflow:forgeflow@localhost:5432/forgeflow
      FORGEFLOW_ENVIRONMENT: test
      LLM_PROVIDER: mock
      FORGEFLOW_AS_OF: "2026-09-03T12:00:00+00:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check forgeflow apps tests
      - name: Ruff format
        run: ruff format --check forgeflow apps tests
      - name: Type check
        run: mypy forgeflow apps
      - name: Apply migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/api/Dockerfile -t forgeflow-api:ci .
